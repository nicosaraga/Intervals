<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Interval Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #6C5CE7;
    --purple-light: #a29bfe;
    --purple-dark: #4834d4;
    --purple-bg: #f0eeff;
    --green: #00b894;
    --green-bg: #e8faf6;
    --red: #d63031;
    --red-bg: #ffeaea;
    --text: #1a1a2e;
    --text-muted: #7c7c9a;
    --bg: #fafafa;
    --card: #ffffff;
    --border: #e8e8f0;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  #app {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ── SELECT SCREEN ── */
  #screen-select {
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    gap: 0;
  }

  .app-header {
    padding: 24px 0 20px;
    flex-shrink: 0;
  }

  .app-title {
    font-size: clamp(26px, 7vw, 32px);
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .app-sub {
    font-size: clamp(13px, 3.5vw, 15px);
    color: var(--text-muted);
    margin-top: 4px;
  }

  .interval-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
    overflow-y: auto;
    padding-bottom: 8px;
  }

  .interval-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 20px) clamp(12px, 3vw, 16px);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: clamp(72px, 16vw, 96px);
    -webkit-user-select: none;
    user-select: none;
  }

  .interval-btn:active {
    background: var(--purple-bg);
    border-color: var(--purple-light);
    transform: scale(0.97);
  }

  .interval-btn .name {
    font-size: clamp(13px, 3.8vw, 16px);
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
  }

  .interval-btn .semi {
    font-family: 'DM Mono', monospace;
    font-size: clamp(11px, 2.8vw, 13px);
    color: var(--purple);
    margin-top: 4px;
  }

  /* ── QUIZ SCREEN ── */
  #screen-quiz {
    padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px);
    gap: 12px;
  }

  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    padding-top: 8px;
  }

  .back-btn {
    font-size: 13px;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    font-family: 'DM Sans', sans-serif;
  }

  .score-pill {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--purple);
    background: var(--purple-bg);
    padding: 5px 12px;
    border-radius: 99px;
  }

  .progress-wrap {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .progress-fill {
    height: 100%;
    background: var(--purple);
    border-radius: 99px;
    transition: width 0.35s cubic-bezier(.4,0,.2,1);
  }

  .note-card {
    background: var(--purple-bg);
    border-radius: var(--radius);
    padding: clamp(20px, 6vw, 32px) 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .q-label {
    font-size: clamp(11px, 3vw, 13px);
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 500;
  }

  .big-note {
    font-family: 'DM Mono', monospace;
    font-size: clamp(56px, 18vw, 80px);
    font-weight: 500;
    color: var(--purple-dark);
    line-height: 1;
    margin: 4px 0;
  }

  .interval-label {
    font-size: clamp(13px, 3.8vw, 16px);
    color: var(--purple);
    font-weight: 500;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
  }

  .answer-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: clamp(22px, 7vw, 30px);
    font-weight: 500;
    color: var(--text);
    text-align: center;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    min-height: 0;
  }

  .answer-btn:active:not(:disabled) {
    transform: scale(0.96);
  }

  .answer-btn:disabled { cursor: default; }

  .answer-btn.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: #006d55;
  }

  .answer-btn.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red);
  }

  .answer-btn.reveal {
    background: var(--green-bg);
    border-color: var(--green);
    color: #006d55;
  }

  .feedback {
    font-size: clamp(13px, 3.8vw, 15px);
    text-align: center;
    min-height: 20px;
    flex-shrink: 0;
    color: var(--text-muted);
    padding: 0 4px;
  }

  .feedback.correct { color: var(--green); font-weight: 500; }
  .feedback.wrong { color: var(--red); font-weight: 500; }

  .next-btn {
    width: 100%;
    padding: clamp(14px, 4.5vw, 18px);
    border-radius: var(--radius);
    border: none;
    background: var(--purple);
    color: #fff;
    font-size: clamp(15px, 4.5vw, 17px);
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }

  .next-btn:active { background: var(--purple-dark); transform: scale(0.98); }

  /* ── RESULT SCREEN ── */
  #screen-result {
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    gap: 12px;
  }

  .result-hero {
    background: var(--purple-bg);
    border-radius: var(--radius);
    padding: clamp(20px, 6vw, 32px) 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .result-score {
    font-family: 'DM Mono', monospace;
    font-size: clamp(52px, 16vw, 72px);
    font-weight: 500;
    color: var(--purple-dark);
    line-height: 1;
  }

  .result-interval {
    font-size: clamp(13px, 3.8vw, 15px);
    color: var(--purple);
    font-weight: 500;
    margin-top: 4px;
  }

  .result-msg {
    font-size: clamp(14px, 4vw, 16px);
    color: var(--text-muted);
    margin-top: 10px;
  }

  .history-wrap {
    flex: 1;
    overflow-y: auto;
    border-radius: var(--radius);
    background: var(--card);
    border: 1.5px solid var(--border);
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: clamp(10px, 3vw, 14px) 16px;
    border-bottom: 1px solid var(--border);
    font-size: clamp(13px, 3.5vw, 15px);
  }

  .history-item:last-child { border-bottom: none; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--green); }
  .dot.no { background: var(--red); }

  .h-notes {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    color: var(--text);
    flex: 1;
  }

  .h-chosen {
    font-family: 'DM Mono', monospace;
    font-size: clamp(12px, 3vw, 13px);
    color: var(--text-muted);
  }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }

  .sec-btn {
    padding: clamp(13px, 4vw, 16px);
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: clamp(13px, 3.8vw, 15px);
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }

  .sec-btn:active { background: var(--border); transform: scale(0.98); }

  .pri-btn {
    padding: clamp(13px, 4vw, 16px);
    border-radius: var(--radius);
    border: none;
    background: var(--purple);
    color: #fff;
    font-size: clamp(13px, 3.8vw, 15px);
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }

  .pri-btn:active { background: var(--purple-dark); transform: scale(0.98); }
</style>
</head>
<body>
<div id="app">

  <div id="screen-select" class="screen active">
    <div class="app-header">
      <div class="app-title">Interval Trainer</div>
      <div class="app-sub">Scegli un intervallo da allenare</div>
    </div>
    <div class="interval-grid" id="interval-grid"></div>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button class="back-btn" onclick="goHome()">← intervalli</button>
      <span class="score-pill" id="score-pill">0 / 0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="note-card">
      <div class="q-label" id="q-label">Domanda 1 di 10</div>
      <div class="big-note" id="big-note">C</div>
      <div class="interval-label" id="interval-label">Terza minore</div>
    </div>
    <div class="answers-grid" id="answers-grid"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" style="visibility:hidden" onclick="nextQuestion()">Prossima →</button>
  </div>

  <div id="screen-result" class="screen">
    <div class="result-hero">
      <div class="result-score" id="result-score">8/10</div>
      <div class="result-interval" id="result-interval"></div>
      <div class="result-msg" id="result-msg"></div>
    </div>
    <div class="history-wrap" id="history-wrap"></div>
    <div class="action-row">
      <button class="sec-btn" onclick="goHome()">Cambia</button>
      <button class="pri-btn" onclick="restartQuiz()">Rigioca</button>
    </div>
  </div>

</div>
<script>
const INTERVALS=[
  {name:"2a maggiore",semitones:2,quality:"M2"},
  {name:"3a minore",semitones:3,quality:"m3"},
  {name:"3a maggiore",semitones:4,quality:"M3"},
  {name:"4a giusta",semitones:5,quality:"P4"},
  {name:"4a aumentata",semitones:6,quality:"A4"},
  {name:"5a giusta",semitones:7,quality:"P5"},
  {name:"6a minore",semitones:8,quality:"m6"},
  {name:"6a maggiore",semitones:9,quality:"M6"},
  {name:"7a minore",semitones:10,quality:"m7"},
  {name:"7a maggiore",semitones:11,quality:"M7"}
];

const CHROMATIC=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const NOTE_WEIGHTS={C:10,D:9,E:9,F:9,G:9,A:9,B:8,Bb:7,Eb:7,Ab:6,Db:6,Gb:5,"F#":5,"C#":4,"G#":4,"D#":3,"A#":3};

const DIATONIC={
  M2:{C:"D",D:"E",E:"F#",F:"G",G:"A",A:"B",B:"C#",Bb:"C",Eb:"F",Ab:"Bb",Db:"Eb",Gb:"Ab","F#":"G#","C#":"D#","G#":"A#","D#":"E#","A#":"B#"},
  m3:{C:"Eb",D:"F",E:"G",F:"Ab",G:"Bb",A:"C",B:"D",Bb:"Db",Eb:"Gb",Ab:"Cb","F#":"A","C#":"E","G#":"B","D#":"F#","A#":"C#"},
  M3:{C:"E",D:"F#",E:"G#",F:"A",G:"B",A:"C#",B:"D#",Bb:"D",Eb:"G",Ab:"C",Db:"F",Gb:"Bb","F#":"A#","C#":"E#"},
  P4:{C:"F",D:"G",E:"A",F:"Bb",G:"C",A:"D",B:"E",Bb:"Eb",Eb:"Ab",Ab:"Db",Db:"Gb",Gb:"Cb","F#":"B","C#":"F#","G#":"C#","D#":"G#","A#":"D#"},
  A4:{C:"F#",D:"G#",E:"A#",F:"B",G:"C#",A:"D#",B:"E#",Bb:"E",Eb:"A",Ab:"D",Db:"G",Gb:"C"},
  P5:{C:"G",D:"A",E:"B",F:"C",G:"D",A:"E",B:"F#",Bb:"F",Eb:"Bb",Ab:"Eb",Db:"Ab",Gb:"Db","F#":"C#","C#":"G#","G#":"D#","D#":"A#","A#":"E#"},
  m6:{C:"Ab",D:"Bb",E:"C",F:"Db",G:"Eb",A:"F",B:"G",Bb:"Gb","F#":"D","C#":"A","G#":"E","D#":"B","A#":"F#"},
  M6:{C:"A",D:"B",E:"C#",F:"D",G:"E",A:"F#",B:"G#",Bb:"G",Eb:"C",Ab:"F",Db:"Bb",Gb:"Eb","F#":"D#","C#":"A#"},
  m7:{C:"Bb",D:"C",E:"D",F:"Eb",G:"F",A:"G",B:"A",Bb:"Ab",Eb:"Db",Ab:"Gb","F#":"E","C#":"B","G#":"F#","D#":"C#","A#":"G#"},
  M7:{C:"B",D:"C#",E:"D#",F:"E",G:"F#",A:"G#",B:"A#",Bb:"A",Eb:"D",Ab:"G",Db:"C",Gb:"F","F#":"E#","C#":"B#"}
};

const ENH={"C#":"Db","Db":"C#","D#":"Eb","Eb":"D#","F#":"Gb","Gb":"F#","G#":"Ab","Ab":"G#","A#":"Bb","Bb":"A#","E#":"F","Fb":"E","B#":"C","Cb":"B"};
const COMMON=["C","D","E","F","G","A","B","Bb","Eb","F#","C#","Ab","Db","G#","Gb","D#","A#"];

function getAnswer(note,q){return DIATONIC[q]&&DIATONIC[q][note]?DIATONIC[q][note]:null;}

function toMidi(note){
  let i=CHROMATIC.indexOf(note);
  if(i===-1){const e=ENH[note];i=e?CHROMATIC.indexOf(e):-1;}
  return i;
}

function weightedSample(pool,n){
  const res=[],avail=[...pool];
  while(res.length<n&&avail.length>0){
    const w=avail.map(x=>NOTE_WEIGHTS[x]||3);
    const tot=w.reduce((a,b)=>a+b,0);
    let r=Math.random()*tot,cum=0,ch=0;
    for(let i=0;i<w.length;i++){cum+=w[i];if(r<=cum){ch=i;break;}}
    res.push(avail.splice(ch,1)[0]);
  }
  return res;
}

function getDistractors(correct,start){
  const d=new Set();
  const e=ENH[correct];
  if(e&&e!==correct)d.add(e);
  const m=toMidi(correct);
  [-1,1,-2,2].forEach(x=>{
    const n=CHROMATIC[((m+x)+12)%12];
    if(n!==correct&&n!==start&&!d.has(n))d.add(n);
  });
  CHROMATIC.forEach(n=>{if(n!==correct&&n!==start&&d.size<6)d.add(n);});
  return [...d].filter(n=>n!==correct).slice(0,3);
}

function shuffle(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}

let sel=null,qs=[],cur=0,score=0,answered=false,hist=[];

function buildSelect(){
  const g=document.getElementById("interval-grid");
  g.innerHTML="";
  INTERVALS.forEach(iv=>{
    const b=document.createElement("button");
    b.className="interval-btn";
    b.innerHTML=`<div class="name">${iv.name}</div><div class="semi">${iv.semitones} semitoni</div>`;
    b.onclick=()=>startQuiz(iv);
    g.appendChild(b);
  });
}

function startQuiz(iv){
  sel=iv;qs=[];hist=[];cur=0;score=0;
  const pool=weightedSample(COMMON.filter(n=>DIATONIC[iv.quality]&&DIATONIC[iv.quality][n]),10);
  const fb=COMMON.filter(n=>!pool.includes(n));
  while(pool.length<10&&fb.length)pool.push(fb.shift());
  pool.slice(0,10).forEach(note=>{
    const correct=getAnswer(note,iv.quality);
    if(!correct)return;
    const dist=getDistractors(correct,note);
    qs.push({start:note,correct,choices:shuffle([correct,...dist.slice(0,3)])});
  });
  showScreen("screen-quiz");
  renderQ();
}

function renderQ(){
  const q=qs[cur];
  answered=false;
  document.getElementById("progress-fill").style.width=(cur/10*100)+"%";
  document.getElementById("q-label").textContent=`Domanda ${cur+1} di 10`;
  document.getElementById("score-pill").textContent=`${score} / ${cur}`;
  document.getElementById("big-note").textContent=q.start;
  document.getElementById("interval-label").textContent=sel.name;
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("next-btn").style.visibility="hidden";
  const grid=document.getElementById("answers-grid");
  grid.innerHTML="";
  q.choices.forEach(c=>{
    const b=document.createElement("button");
    b.className="answer-btn";b.textContent=c;
    b.onclick=()=>handleAnswer(c,b,q);
    grid.appendChild(b);
  });
}

function handleAnswer(choice,btn,q){
  if(answered)return;
  answered=true;
  const ok=choice===q.correct;
  document.querySelectorAll(".answer-btn").forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct)b.classList.add("reveal");
  });
  const fb=document.getElementById("feedback");
  if(ok){
    btn.classList.add("correct");
    fb.textContent="Esatto!";
    fb.className="feedback correct";
    score++;
  } else {
    btn.classList.add("wrong");
    fb.textContent=`Sbagliato — era ${q.correct}`;
    fb.className="feedback wrong";
  }
  hist.push({start:q.start,correct:q.correct,chosen:choice,ok});
  document.getElementById("score-pill").textContent=`${score} / ${cur+1}`;
  if(cur<9){
    document.getElementById("next-btn").style.visibility="visible";
  } else {
    setTimeout(showResult,900);
  }
}

function nextQuestion(){cur++;renderQ();}

function showResult(){
  showScreen("screen-result");
  document.getElementById("result-score").textContent=`${score}/10`;
  document.getElementById("result-interval").textContent=sel.name;
  const msgs=["Perfetto! Maestro degli intervalli.","Ottimo! Quasi perfetto.","Bene! Continua così.","Ci siamo quasi, vai avanti.","Riprova! La pratica paga."];
  document.getElementById("result-msg").textContent=score===10?msgs[0]:score>=8?msgs[1]:score>=6?msgs[2]:score>=4?msgs[3]:msgs[4];
  const wrap=document.getElementById("history-wrap");
  wrap.innerHTML="";
  hist.forEach(h=>{
    const d=document.createElement("div");
    d.className="history-item";
    d.innerHTML=`<span class="dot ${h.ok?"ok":"no"}"></span><span class="h-notes">${h.start} → ${h.correct}</span><span class="h-chosen">${h.ok?"":"Tu: "+h.chosen}</span>`;
    wrap.appendChild(d);
  });
}

function goHome(){showScreen("screen-select");}
function restartQuiz(){startQuiz(sel);}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

buildSelect();
</script>
</body>
</html>
